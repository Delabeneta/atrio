# render.yaml
services:
  - type: web
    name: atrio-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COORDENADOR_PASSWORD
        sync: false
      - key: LIDER_PASSWORD
        sync: false
